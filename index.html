<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Page</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f0f2f5;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }
        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>HTML Test Page</h1>
        <p>If you see this, the <strong>HTML</strong> is working.</p>
        <p style="color: blue;">If this text is blue, <strong>CSS</strong> is working.</p>
        <button onclick="testJS()">Click me for JS test</button>
        <p id="result"></p>
    </div>

    <script>
        function testJS() {
            document.getElementById('result').innerText = "✅ JavaScript is working!";
            console.log("Button clicked successfully!");
        }
    </script>

</body>
</html>
